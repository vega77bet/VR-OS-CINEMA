name: Cinema - build and native visual tests
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: aurora-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cinema:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and app icon
        run: |
          swift Tools/MakeIcon.swift
          xcodegen generate
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -project VROSCinema.xcodeproj -scheme VROSCinema -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Run native scene tests
        id: scenes
        timeout-minutes: 8
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for devices in json.load(sys.stdin)["devices"].values() for d in devices]; print(next(d["udid"] for d in ds if d["name"] == "iPhone 16"))')
          echo "CINEMA_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild -project VROSCinema.xcodeproj -scheme VROSCinema -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath test-build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing | tee simulator-build.log
          XCTESTRUN_FILE=$(python3 -c 'from pathlib import Path; print(next(Path("test-build/Build/Products").glob("*.xctestrun")))')
          echo "CINEMA_XCTESTRUN_FILE=$XCTESTRUN_FILE" >> "$GITHUB_ENV"
          xcodebuild test-without-building -xctestrun "$XCTESTRUN_FILE" -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath SceneTests.xcresult -parallel-testing-enabled NO -only-testing:CinemaTests -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 | tee scene-tests.log
      - name: Export native gallery
        if: ${{ always() && steps.scenes.outcome != 'skipped' }}
        run: python3 Tools/export-previews.py SceneTests.xcresult Previews
      - name: Upload native gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-native-previews
          path: Previews
          if-no-files-found: warn
          retention-days: 30
      - name: Test native touch navigation
        id: navigation
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcrun simctl shutdown "$CINEMA_SIMULATOR_ID" || true
          xcrun simctl boot "$CINEMA_SIMULATOR_ID"
          xcrun simctl bootstatus "$CINEMA_SIMULATOR_ID" -b
          xcodebuild test-without-building -xctestrun "$CINEMA_XCTESTRUN_FILE" -destination "platform=iOS Simulator,id=$CINEMA_SIMULATOR_ID" -resultBundlePath NavigationTests.xcresult -parallel-testing-enabled NO -only-testing:CinemaUITests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 | tee navigation-tests.log
          python3 -c 'from pathlib import Path; import re; log=Path("navigation-tests.log").read_text(); assert re.search(r"Test Case .*testTourLightingAndBinocularReturn.* passed", log), "The UI test must run and pass; an empty test selection is not success"'
      - name: Export UI attachments
        if: ${{ always() && steps.navigation.outcome != 'skipped' }}
        run: xcrun xcresulttool export attachments --path NavigationTests.xcresult --output-path InterfacePreviews
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-interface-previews
          path: InterfacePreviews
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-test-evidence
          path: |
            SceneTests.xcresult
            NavigationTests.xcresult
            build.log
            simulator-build.log
            scene-tests.log
            navigation-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Package unsigned preview
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VROSCinema.app Payload/
          zip -qry VR-OS-Cinema-0.1.0-visual-unsigned.ipa Payload
      - name: Upload iPhone preview
        uses: actions/upload-artifact@v4
        with:
          name: VR-OS-Cinema-visual-IPA
          path: VR-OS-Cinema-0.1.0-visual-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
